name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # minimumReleaseAge in pnpm-workspace.yaml holds new releases back for a
      # week; --frozen-lockfile keeps CI on exactly what the lockfile pins.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      # typecheck regenerates worker-configuration.d.ts first: it is generated,
      # not committed, and without it every Workers global and binding is unknown.
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm test:scripts
